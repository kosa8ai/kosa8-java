name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Unit tests against the mock daemon: no real daemon, no network. test.sh picks the
      # classpath separator for the platform (';' under Git Bash on Windows).
      - name: test
        shell: bash
        run: ./test.sh
